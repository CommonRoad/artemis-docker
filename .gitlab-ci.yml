# Builds each image in <name>/ and pushes it to this project's registry as
# $CI_REGISTRY_IMAGE/<name>:<short commit SHA> and :latest.
# Kaniko builds without a Docker daemon, so no privileged runner is needed.

stages:
  - build

.build:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]
  variables:
    IMAGE: $CI_REGISTRY_IMAGE/$NAME
  script:
    - AUTH=$(printf '%s:%s' "$CI_REGISTRY_USER" "$CI_REGISTRY_PASSWORD" | base64 | tr -d '\n')
    - echo "{\"auths\":{\"$CI_REGISTRY\":{\"auth\":\"$AUTH\"}}}" > /kaniko/.docker/config.json
    - /kaniko/executor
      --context "$CI_PROJECT_DIR/$NAME"
      --dockerfile "$CI_PROJECT_DIR/$NAME/Dockerfile"
      --destination "$IMAGE:$CI_COMMIT_SHORT_SHA"
      --destination "$IMAGE:latest"
    - echo "Docker Image for Artemis:" "$IMAGE:$CI_COMMIT_SHORT_SHA"

build-bonus:
  extends: .build
  variables:
    NAME: bonus
  rules:
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - bonus/**/*
        - .gitlab-ci.yml
    - when: manual
      allow_failure: true

build-competition:
  extends: .build
  variables:
    NAME: competition
  rules:
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - competition/**/*
        - .gitlab-ci.yml
    - when: manual
      allow_failure: true
