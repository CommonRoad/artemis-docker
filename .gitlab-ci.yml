# Builds each image in <name>/ and pushes it as <short commit SHA> and :latest
# to this project's registry and, when GHCR_USER and GHCR_TOKEN are set, to
# ghcr.io/commonroad/artemis-docker/<name>. Artemis pulls from ghcr.io, because its
# build agents cannot pull from this registry's port 5005.
# Kaniko builds without a Docker daemon or user namespaces, so it runs on the
# unprivileged tum-cps runner (BuildKit rootless and Buildah need user
# namespaces, which the runner blocks). Google's kaniko is archived, so this
# uses the maintained fork https://github.com/osscontainertools/kaniko.

stages:
  - build

.build:
  stage: build
  image:
    name: ghcr.io/osscontainertools/kaniko:v1.29.0-debug
    entrypoint: [""]
  variables:
    IMAGE: $CI_REGISTRY_IMAGE/$NAME
    GHCR_IMAGE: ghcr.io/commonroad/artemis-docker/$NAME
  script:
    - GITLAB_AUTH=$(printf '%s:%s' "$CI_REGISTRY_USER" "$CI_REGISTRY_PASSWORD" | base64 | tr -d '\n')
    - AUTHS="\"$CI_REGISTRY\":{\"auth\":\"$GITLAB_AUTH\"}"
    - DESTINATIONS="--destination $IMAGE:$CI_COMMIT_SHORT_SHA --destination $IMAGE:latest"
    - |
      if [ -n "$GHCR_USER" ] && [ -n "$GHCR_TOKEN" ]; then
        GHCR_AUTH=$(printf '%s:%s' "$GHCR_USER" "$GHCR_TOKEN" | base64 | tr -d '\n')
        AUTHS="$AUTHS,\"ghcr.io\":{\"auth\":\"$GHCR_AUTH\"}"
        DESTINATIONS="$DESTINATIONS --destination $GHCR_IMAGE:$CI_COMMIT_SHORT_SHA --destination $GHCR_IMAGE:latest"
      fi
    - echo "{\"auths\":{$AUTHS}}" > /kaniko/.docker/config.json
    - /kaniko/executor --context "$CI_PROJECT_DIR/$NAME" --dockerfile "$CI_PROJECT_DIR/$NAME/Dockerfile" --label org.opencontainers.image.source=https://github.com/CommonRoad/artemis-docker $DESTINATIONS
    - |
      if [ -n "$GHCR_TOKEN" ]; then
        echo "Docker Image for Artemis: $GHCR_IMAGE:$CI_COMMIT_SHORT_SHA"
      else
        echo "GHCR_USER/GHCR_TOKEN not set; pushed only to $IMAGE:$CI_COMMIT_SHORT_SHA"
      fi

build-bonus:
  extends: .build
  variables:
    NAME: bonus
  rules:
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - bonus/**/*
        - .gitlab-ci.yml
    - when: manual
      allow_failure: true

build-competition:
  extends: .build
  variables:
    NAME: competition
  rules:
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - competition/**/*
        - .gitlab-ci.yml
    - when: manual
      allow_failure: true
